<script>
  (() => {
    const sheet = document.querySelector('link[rel="stylesheet"]');
    if (!sheet) return;
    const url = new URL(sheet.href);
    url.searchParams.set('v', '{{ site.time | date: "%s" }}');
    sheet.href = url.href;
  })();
</script>
<script src="{{ '/assets/docs-theme.js' | relative_url }}?v={{ site.time | date: '%s' }}"></script>
